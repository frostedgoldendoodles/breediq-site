    <script>
      (function () {
        function setCtx() {
          if (!window.AskBreedIQ) return;
          window.AskBreedIQ.setContext({ page: 'dogs' });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setCtx);
        } else {
          setTimeout(setCtx, 0);
        }
      })();
    </script>
    <script>
      // Register the BreedIQ service worker so the app is installable
      // and the shell loads on flaky connections. Live data still comes
      // straight from the network — see /sw.js for the strategy.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* ignore */ });
