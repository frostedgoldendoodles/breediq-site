<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QVB6YGCS7F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QVB6YGCS7F');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your BreedIQ dashboard. Monitor your breeding program, track litters, and manage your dogs.">
    <title>Dashboard &mdash; BreedIQ</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%230F766E'>&#x1F43E;</text></svg>">
    <!-- PWA: installable app, iOS + Android home screen -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BreedIQ">
    <link rel="canonical" href="https://breediq.ai/dashboard">
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <!-- Dashboard app. Source: src/dashboard.jsx — compiled to this bundle
         by `npm run build` (esbuild). Edit the source, not the bundle. -->
    <script src="/dashboard.bundle.js" defer></script>

    <!-- Ask BreedIQ — floating AI assistant (Phase 2) -->
    <script src="/ask-breediq.js" defer></script>
    <script>
      // Register a coarse page context. When the dashboard view mounts a specific
      // entity (e.g. a dog drill-down), the relevant component can refine this via
      // window.AskBreedIQ.setContext(...).
      (function () {
        function setCtx() {
          if (!window.AskBreedIQ) return;
          const params = new URLSearchParams(location.search);
          const view = params.get('view') || 'dashboard';
          window.AskBreedIQ.setContext({ page: 'dashboard', entity_snapshot: { view } });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setCtx);
        } else {
          setTimeout(setCtx, 0);
        }
      })();
    </script>
    <script>
      // Register the BreedIQ service worker so the app is installable
      // and the shell loads on flaky connections. Live data still comes
      // straight from the network — see /sw.js for the strategy.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* ignore */ });
        });
      }
    </script>
</body>
</html>
