    <style>
        html {
            scroll-behavior: smooth;
        }

        .gradient-blue-emerald {
            background: linear-gradient(135deg, #2563eb 0%, #10b981 100%);
        }

        .gradient-text-blue-emerald {
            background: linear-gradient(135deg, #2563eb 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #10b981;
        }

        .feature-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.2);
        }

        .pricing-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pricing-card.popular {
            border: 2px solid #10b981;
        }

        .pricing-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.2);
        }

        .accordion-header {
            cursor: pointer;
            user-select: none;
        }

        .accordion-header:hover {
            color: #10b981;
        }

        @keyframes heatPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .heat-pulse {
            animation: heatPulse 1.5s ease-in-out infinite;
        }

        @keyframes progressFill {
            from { width: 0%; }
            to { width: 28%; }
        }
        .progress-fill {
            animation: progressFill 2s ease-out forwards;
        }

        .demo-screen {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .demo-screen-enter {
            opacity: 1;
            transform: translateY(0);
        }
        .demo-screen-exit {
            opacity: 0;
            transform: translateY(8px);
            position: absolute;
            inset: 0;
        }
        .demo-tab {
            transition: all 0.3s ease;
        }
        .demo-tab-active {
            background: linear-gradient(135deg, #2563eb, #10b981);
            color: white;
        }
        @keyframes demoPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 0 6px rgba(16,185,129,0); }
        }
        .demo-tab-active {
            animation: demoPulse 2s ease-in-out infinite;
        }
        @keyframes progressGrow {
            from { width: 0%; }
            to { width: var(--target-width); }
        }
        .progress-animate {
            animation: progressGrow 1.5s ease-out forwards;
        }
    </style>

    <script>
      // Register the BreedIQ service worker so the app is installable
      // and the shell loads on flaky connections. Live data still comes
      // straight from the network — see /sw.js for the strategy.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* ignore */ });
        });
      }
    </script>
