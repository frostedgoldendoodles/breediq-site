    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Set up your BreedIQ breeding program. Paste anything — notes, spreadsheets, texts — and our AI extracts your dogs, litters, and guardians.">
    <title>Get Started &mdash; BreedIQ</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

    <script src="/vendor/react-dom-18.2.0.production.min.js" defer></script>
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Onboarding-only styles. Brand primitives (.gradient-button,
           .gradient-bg, …) live in styles.css. */
        .paste-box {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(59, 130, 246, 0.3);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .paste-box:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .dragover {
            background-color: rgba(59, 130, 246, 0.15) !important;
            border-color: #3b82f6 !important;
        }

        .file-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 6px;
            font-size: 13px;
            color: #d1d5db;
        }

        @keyframes slide-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .extraction-row {
            animation: slide-in 0.3s ease-out both;
        }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            margin-right: 10px;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        .group-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 10px;
        }

        .entity-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: start;
            padding: 12px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.4);
            border-radius: 8px;
        }

        .entity-row input,
        .entity-row select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.6);
            border-radius: 4px;
            padding: 4px 8px;
            color: #f1f5f9;
            font-size: 13px;
        }

        .entity-row input:focus,
        .entity-row select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(71, 85, 105, 0.6);
            color: #94a3b8;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s ease;
        }

        .icon-btn:hover {
            color: #f1f5f9;
            border-color: rgba(148, 163, 184, 0.8);
        }

        .icon-btn.danger:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        .ask-box {
            background: rgba(234, 179, 8, 0.08);
            border: 1px solid rgba(234, 179, 8, 0.35);
            border-radius: 8px;
            padding: 14px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="root"></div>
    <noscript>
      <div style="max-width:34rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;color:#e2e8f0;text-align:center">
        <h1 style="font-size:1.5rem;margin:0 0 .75rem">BreedIQ needs JavaScript</h1>
        <p style="color:#94a3b8;line-height:1.6;margin:0 0 1.5rem">
          This page is rendered in the browser, so it needs JavaScript enabled.
          Turn it on and reload, or email us and we'll help.
        </p>
        <a href="mailto:spencer@breediq.ai" style="color:#10b981">spencer@breediq.ai</a>
      </div>
    </noscript>

    <!-- onboarding app. Source: src/onboarding.jsx (npm run compile). -->
    <script src="/onboarding.bundle.js" defer></script>

    <!-- Ask BreedIQ — floating AI assistant (Phase 2) -->
    <script src="/ask-breediq.js" defer></script>
    <script>
      (function () {
        function setCtx() {
          if (!window.AskBreedIQ) return;
          window.AskBreedIQ.setContext({ page: 'onboarding' });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setCtx);
        } else {
          setTimeout(setCtx, 0);
        }
      })();
    </script>
    <script>
      // Register the BreedIQ service worker so the app is installable
      // and the shell loads on flaky connections. Live data still comes
      // straight from the network — see /sw.js for the strategy.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* ignore */ });
        });
      }
    </script>
</body>
</html>
